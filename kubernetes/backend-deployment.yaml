apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-backend
  template:
    metadata:
      labels:
        app: erp-backend
    spec:
      containers:
      - name: erp-backend
        image: erp-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres:5432/erp_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "erp_user"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "erp_password"
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: erp-backend-svc
spec:
  type: NodePort
  selector:
    app: erp-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
