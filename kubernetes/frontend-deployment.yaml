apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-frontend
  namespace: erp-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-frontend
  template:
    metadata:
      labels:
        app: erp-frontend
    spec:
      containers:
      - name: erp-frontend
        image: registry.erpnexa.local/erp-frontend:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: erp-frontend-svc
  namespace: erp-production
spec:
  type: LoadBalancer
  selector:
    app: erp-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
